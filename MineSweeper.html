<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>MineSweeper</title>
        <link rel="stylesheet" href="MineSweeper.css">
        <script src="MineSweeper.js" defer></script>
    </head>
    <body>
        <header><h1>Mine Sweeper</h1></header>
    
        <aside id="dificultad">
            <!--Tamaño segun dificultad modificable-->
            <button data-tamanio="9"  data-minas="10">Easy</button>
            <button data-tamanio="16" data-minas="40">Medium</button>
            <button data-tamanio="30" data-minas="99">Hard</button>
            <button id="botonPersonalizadoToggle">Custom ▾</button>

            <div id="personalizado" class="oculto">
                <input type="number" id="inputFilas" min="5" max="30">
                <label for="inputFilas">Rows</label>              
                <input type="number" id="inputColumnas" min="5" max="30">
                <label for="inputColumnas">Columns</label>
                <input type="number" id="inputMinas" min="1" max="1000">
                <label for="inputMinas">Mines</label>
                <button id="botonPersonalizado">Play</button>
            </div>
        </aside>

        <main>
            <div class="barra">
                <div id="contadorMinas">🚩 10</div>
                <button id="reiniciar">🙂</button>
                <div id="cronometro">000</div>
            </div>

            <div id="tablero" class="juego"></div>

            <div id="mensaje"></div>
        </main>
    </body>
</html>
